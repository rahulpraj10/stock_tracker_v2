<div id="chartModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div class="modal-content" style="background-color: var(--card-bg); padding: 24px; border-radius: 12px; width: 80%; max-width: 900px; position: relative; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);">
        <span onclick="closeChartModal()" style="position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: var(--text-secondary);">&times;</span>
        <h3 id="modalStockName" style="margin-bottom: 20px; color: var(--text-main);">Stock Performance</h3>
        <div style="height: 400px; width: 100%;">
            <canvas id="stockChart"></canvas>
        </div>
    </div>
</div>

<script>
let healthChart = null;

async function openBasketChart(scCode, stockName) {
    const modal = document.getElementById('chartModal');
    document.getElementById('modalStockName').textContent = `${stockName} (${scCode})`;
    modal.style.display = 'flex';

    try {
        const response = await fetch(`/api/stock/${scCode}/history`);
        const data = await response.json();

        if (data.error) {
            console.error(data.error);
            return;
        }

        const ctx = document.getElementById('stockChart').getContext('2d');
        if (healthChart) { healthChart.destroy(); }

        healthChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: [{
                    label: 'Close Price',
                    data: data.prices,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { display: false } },
                    y: { ticks: { callback: val => '₹' + val } }
                }
            }
        });
    } catch (error) {
        console.error("Chart load error:", error);
    }
}

function closeChartModal() {
    document.getElementById('chartModal').style.display = 'none';
}

window.onclick = function(event) {
    const modal = document.getElementById('chartModal');
    if (event.target == modal) closeChartModal();
}
</script>
